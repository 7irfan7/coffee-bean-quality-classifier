<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title><link rel="stylesheet"
      href="{{ url_for('static', filename='css/login.css') }}">

</head><body><div class="container">

    <div class="card">

        <h1>LOGIN</h1>

        {% if pesan %}
        <div class="error">
            {{ pesan }}
        </div>
        {% endif %}

        <form action="/login" method="POST">

            <label>Email</label>
            <input type="email"
                   name="email"
                   required>

            <label>Password</label>
            <input type="password"
                   name="password"
                   required>

            <button type="submit">
                Login
            </button>

        </form>

        <p>
            Belum punya akun?
            <a href="/registrasi">
                Register
            </a>
        </p>

    </div>

</div>

</body>
</html>
